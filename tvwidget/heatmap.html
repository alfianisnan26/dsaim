<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // dataSource param, default IDX30
  const dataSource = params.get("dataSource") || "AllID";

  // theme param, default light
  const colorTheme = params.get("theme") || "light";

  // redirectUrl param, no default
  const redirectUrl = params.get("redirectUrl") || "";
  const locale = params.get("locale") || "id";
  const hasTopBar = params.get("hasTopBar") || "true" === "true";
  const isDataSetEnabled = params.get("isDataSetEnabled") || "false" === "true";
  const isZoomEnabled = params.get("isZoomEnabled") || "false" === "true";
  const hasSymbolTooltip = params.get("hasSymbolTooltip") || "true" === "true";
  const isMonoSize = params.get("isMonoSize") || "false" === "true";
  let exchanges = params.getAll("exchange") || [];
  if (params.has("exchanges")) {
    exchanges = params.get("exchanges").split(",").map(s => s.trim());
  }

  const config = {
    dataSource,
    locale,
    symbolUrl: redirectUrl,
    colorTheme,
    exchanges: exchanges,
    hasTopBar,
    isDataSetEnabled,
    isZoomEnabled,
    hasSymbolTooltip,
    isMonoSize,
    width: "100%",
    height: "100%"
  };

  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
  script.async = true;
  script.innerHTML = JSON.stringify(config);

  document.querySelector(".tradingview-widget-container__widget").appendChild(script);
</script>
