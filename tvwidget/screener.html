<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // theme param -> colorTheme (default = light)
  const colorTheme = params.get("theme") || "light";

  // redirectUrl param -> largeChartUrl (no default)
  const largeChartUrl = params.get("redirectUrl") || "";

  const market = params.get("market") || "indonesia";

  const defaultColumn = params.get("defaultColumn") || "overview";

  const defaultScreen = params.get("defaultScreen") || "most_capitalized";

  const locale = params.get("locale") || "id";

  const showToolbar = params.get("showToolbar") || "true" === "true";

  // create TradingView script
  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-screener.js";
  script.async = true;
  script.innerHTML = JSON.stringify({
    market,
    showToolbar,
    defaultColumn,
    defaultScreen,
    isTransparent: false,
    locale,
    colorTheme,
    largeChartUrl,
    width: "100%",
    height: "100%"
  });

  document.querySelector(".tradingview-widget-container__widget").appendChild(script);
</script>
