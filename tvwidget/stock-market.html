<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // exchange (no default)
  const exchange = params.get("exchange") || "IDX";

  // theme param -> colorTheme (default = light)
  const colorTheme = params.get("theme") || "light";

  // redirectUrl param -> largeChartUrl (no default)
  const largeChartUrl = params.get("redirectUrl") || "";

  const dateRange = params.get("dateRange") || "1D";

  const showChart = params.get("showChart") || "true" === "true";

  const locale = params.get("locale") || "id";

  const showSymbolLogo = params.get("showSymbolLogo") || "true" === "true";

  const showFloatingTooltip = params.get("showFloatingTooltip") || "true" === "true";

  // create TradingView script
  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-hotlists.js";
  script.async = true;
  script.innerHTML = JSON.stringify({
    exchange,
    colorTheme,
    dateRange,
    showChart,
    locale,
    largeChartUrl,
    isTransparent: false,
    showSymbolLogo,
    showFloatingTooltip,
    width: "100%",
    height: "100%"
  });

  document.querySelector(".tradingview-widget-container__widget").appendChild(script);
</script>
