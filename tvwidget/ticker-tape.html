<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // handle ?symbol=...&symbol=... or ?symbols=...
  let symbols = params.getAll("symbol");
  if (params.has("symbols")) {
    symbols = params.get("symbols").split(",").map(s => s.trim());
  }

  // build dynamic list (no defaults)
  const widgetSymbols = symbols.map(sym => ({
    proName: sym,
    title: sym.includes(":") ? sym.split(":")[1] : sym
  }));

  // colorTheme support with fallback
  const colorTheme = params.get("colorTheme") || "light";

  const largeChartUrl = params.get("redirectUrl") || "";

  const locale = params.get("locale") || "id";

  const showSymbolLogo = params.get("showSymbolLogo") || "true" === "true";

  const displayMode = params.get("displayMode") || "compact"; // compact, adaptive, regular

  // create TradingView script
  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
  script.async = true;
  script.innerHTML = JSON.stringify({
    symbols: widgetSymbols,
    colorTheme,
    locale,
    isTransparent: false,
    showSymbolLogo,
    displayMode,
    largeChartUrl,
  });

  document.querySelector(".tradingview-widget-container__widget").appendChild(script);
</script>
